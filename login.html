<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gary — sign in</title>
<style>
  body { font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #0b0b0c; color: #ddd;
         margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  form { width: 100%; max-width: 20rem; padding: 2rem; }
  h1 { font-size: 1rem; color: #888; font-weight: 500; margin: 0 0 1.5rem; }
  h1 code { color: #6cc06c; }
  label { display: block; color: #888; font-size: .8rem; margin: 0 0 .3rem; }
  input { width: 100%; box-sizing: border-box; background: #141416; border: 1px solid #333;
          border-radius: 6px; color: #ddd; padding: .5rem .6rem; font: inherit; margin-bottom: 1rem; }
  input:focus { outline: none; border-color: #6cc06c; }
  button { width: 100%; background: #163a1f; border: 1px solid #2d6b3a; color: #6cc06c;
           border-radius: 6px; padding: .5rem; font: inherit; cursor: pointer; }
  button:hover { background: #1b4526; }
  .error { background: #3d1919; border: 1px solid #6b2d2d; color: #d76b6b; border-radius: 6px;
           padding: .5rem .6rem; margin-bottom: 1rem; font-size: .85rem; }
</style>
</head>
<body>
<form method="POST" action="login">
  <h1>sign in to <code>gary</code></h1>
  <!--ERROR-->
  <label for="u">username</label>
  <input id="u" name="username" autocomplete="username" autofocus required>
  <label for="p">password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">sign in</button>
</form>
</body>
</html>
